name: Backend CI

on:
  pull_request:
    branches: [main, dev]
    paths: ['apps/backend/**', '.github/workflows/ci.yml']
  push:
    branches: [main, dev]
    paths: ['apps/backend/**', '.github/workflows/ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecoplus
          POSTGRES_PASSWORD: ecoplus
          POSTGRES_DB: ecoplus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecoplus -d ecoplus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ecoplus:ecoplus@localhost:5432/ecoplus_test
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/backend/.nvmrc
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Migrations that already exist are never edited
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- apps/backend/prisma/migrations)
          if [ -n "$changed" ]; then
            echo "A migration that is already on ${{ github.base_ref }} was edited, renamed or deleted. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations produce exactly the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The e2e setup reads .env.test; CI points it at the service database above.
      - run: |
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=$DATABASE_URL#" .env.test
          npm run test:e2e
      - run: npm run build
